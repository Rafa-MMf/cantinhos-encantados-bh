<body>
    <main class="registration-container">
        <header class="header-section">
            <h1 class="main-heading">Adicione sua cafeteria agora no Cantinhos Encantados!</h1>
            <p class="description-text">
                ...
            </p>
        </header>

        <section class="form-section">
            <form id="formCafeteria" class="registration-form">

                <div class="field-group">
                    <label class="field-label" for="nome">Nome da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="text" id="nome" placeholder="Nome da Cafeteria" required>
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="telefone">Telefone da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="tel" id="telefone" class="form-input" placeholder="(31) 99999-9999">
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="tipo">Faixa de preço</label>
                    <select id="faixa_preco" class="form-input, input-wrapper">
                        <option value="">Selecionar</option>
                        <option value="BAIXO">Baixo</option>
                        <option value="MEDIO">Médio</option>
                        <option value="LTO">Alto</option>
                    </select>
                </div>

                <div class="field-group">
                    <label class="field-label" for="bairro">Bairro da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="text" id="bairro" class="form-input" placeholder="Bairro">
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="instagram">Instagram da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="text" id="instagram" class="form-input" placeholder="@instagram">
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="site">Site da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="text" id="site" class="form-input" placeholder="www.site.com">
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="descricao">Descrição da Cafeteria</label>
                    <div class="input-wrapper">
                        <textarea id="descricao" class="form-input" placeholder="Descrição da Cafeteria"></textarea>
                    </div>
                    <span class="error"></span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="endereco">Endereço da Cafeteria</label>
                    <div class="input-wrapper">
                        <input type="text" id="endereco" class="form-input" placeholder="Endereço da Cafeteria">
                    </div>
                    <span class="error"></span>
                </div>

                <div class="form-separator">
                    <div class="separator-line"></div>
                </div>

                <button type="submit" class="submit-button" id="btnSubmit">
                    <span class="button-text">Criar Cafeteria</span>
                </button>

                <div id="successMessage" class="success"></div>

            </form>
        </section>


    </main>

        <div class="footer-container">
            <div class="footer-content">

                    </div>

    </footer>

</body>
